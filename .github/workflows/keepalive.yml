name: keepalive

# The Supabase free tier pauses projects after about a week without activity, which would break
# every stored link. Ping it every 3 days.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'content-profile: sealdown' \
            -H 'content-type: application/json' -d '{}'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep this schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
