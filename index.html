<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sealdown</title>
    <meta name="description" content="Paste Markdown with Mermaid diagrams, math and code, and share a rendered link. No account; encrypted in your browser." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Link previews. Chat apps never see the #fragment, so every shared link previews the same. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sealdown" />
    <meta property="og:title" content="sealdown" />
    <meta property="og:description" content="A shared Markdown document with Mermaid diagrams, math and code. Open the link to read it." />
    <meta property="og:image" content="https://trainedloop.github.io/sealdown/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="sealdown: Paste Markdown. Share a rendered link." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sealdown" />
    <meta name="twitter:description" content="A shared Markdown document with Mermaid diagrams, math and code. Open the link to read it." />
    <meta name="twitter:image" content="https://trainedloop.github.io/sealdown/og.png" />
    <script>
      // Set the theme before first paint so dark-mode readers don't see a white flash.
      try {
        var t = localStorage.getItem('sealdown.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
