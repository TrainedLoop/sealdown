<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sealdown</title>
    <meta name="description" content="Share Markdown with Mermaid diagrams, math and code in an encrypted link. No account; sealed in your browser, with an optional password." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%sealdown-logo/sealdown-icon-color.svg" />
    <!-- Link previews. Chat apps never see the #fragment, so every shared link previews the same. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sealdown" />
    <meta property="og:title" content="sealdown" />
    <meta property="og:description" content="A sealed Markdown document. Open the link to read it; it is decrypted only in your browser." />
    <meta property="og:image" content="https://trainedloop.github.io/sealdown/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sealdown: share Markdown in a sealed link." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sealdown" />
    <meta name="twitter:description" content="A sealed Markdown document. Open the link to read it; it is decrypted only in your browser." />
    <meta name="twitter:image" content="https://trainedloop.github.io/sealdown/og.png" />
    <script>
      // Set the theme before first paint so dark-mode readers don't see a white flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('sealdown.theme') === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
