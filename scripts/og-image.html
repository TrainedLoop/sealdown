<!doctype html>
<!-- Source of public/og.png (1200×630). Regenerate with: node scripts/render-og.mjs (inside the
     Playwright image: scripts/playwright-docker.sh is for tests, see README). -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #fbfaf8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1d1d1f; display: flex; align-items: center; padding: 0 80px; gap: 64px; overflow: hidden; }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .brand img { width: 72px; height: 72px; }
  .brand span { font-size: 64px; font-weight: 800; letter-spacing: -2px; }
  h1 { font-size: 52px; line-height: 1.12; font-weight: 750; letter-spacing: -1px; margin-bottom: 28px; }
  h1 em { font-style: normal; color: #3b5bdb; }
  p { font-size: 26px; color: #6b6b70; line-height: 1.45; }
  .card { width: 420px; background: #fff; border: 1px solid #e4e2dd; border-radius: 20px; box-shadow: 0 24px 60px rgba(29, 29, 31, 0.12); padding: 32px; }
  .line { height: 14px; border-radius: 7px; background: #e9e7e2; margin-bottom: 12px; }
  .title { height: 22px; width: 60%; background: #1d1d1f; border-radius: 6px; margin-bottom: 22px; }
  svg { display: block; margin: 18px auto 8px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../public/favicon.svg" alt=""><span>rendermd</span></div>
    <h1>Paste Markdown.<br><em>Share a rendered link.</em></h1>
    <p>Mermaid diagrams, math and code.<br>No account. Encrypted in your browser.</p>
  </div>
  <div class="card">
    <div class="title"></div>
    <div class="line" style="width: 92%"></div>
    <div class="line" style="width: 78%"></div>
    <svg width="320" height="200" viewBox="0 0 320 200" fill="none">
      <rect x="110" y="8" width="100" height="44" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="3"/>
      <rect x="20" y="140" width="100" height="44" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="3"/>
      <rect x="200" y="140" width="100" height="44" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="3"/>
      <path d="M160 52v40M160 92L70 140M160 92l90 48" stroke="#3b5bdb" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="line" style="width: 85%"></div>
    <div class="line" style="width: 64%; margin-bottom: 0"></div>
  </div>
</body>
</html>
