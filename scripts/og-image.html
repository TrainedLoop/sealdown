<!doctype html>
<!-- Source of public/og.png (1200x630). Re-render: node scripts/render-og.mjs inside the Playwright image. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/ibm-plex-sans/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0f1419; color: #dbe4ea;
    font-family: 'IBM Plex Sans Variable', sans-serif; display: grid; grid-template-columns: 1fr 420px; align-items: center; gap: 56px; padding: 0 84px; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 44px; }
  .brand img { height: 72px; width: auto; }
  .brand span { font: 500 52px/1 'IBM Plex Mono', monospace; letter-spacing: -0.03em; }
  h1 { font-size: 54px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 26px; }
  p { font-size: 22px; line-height: 1.5; color: #8a9fae; }
  .sheet { position: relative; background: #161f27; border: 1px solid #2b3a46; border-radius: 10px; padding: 34px; box-shadow: 0 30px 70px rgba(0,0,0,.55); }
  .line { height: 13px; border-radius: 7px; background: #24323d; margin-bottom: 12px; }
  .title { height: 22px; width: 58%; border-radius: 6px; background: #dbe4ea; margin-bottom: 24px; }
  .stamp { position: absolute; right: -30px; bottom: -34px; height: 138px; width: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
  .flow { display: flex; align-items: center; gap: 10px; margin: 22px 0; }
  .flow i { flex: 1; height: 40px; border: 2px solid #2dd4a7; border-radius: 6px; background: #1b2a33; }
  .flow b { width: 22px; height: 2px; background: #8a9fae; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="../public/sealdown-logo/sealdown-icon-white.svg" alt=""><span>sealdown</span></div>
    <h1>Share Markdown or JSON in a sealed link.</h1>
    <p>Encrypted in your browser. Password optional.<br>Diagrams, math and code — and live documents to edit together.</p>
  </div>
  <div class="sheet">
    <div class="title"></div>
    <div class="line" style="width: 92%"></div>
    <div class="line" style="width: 76%"></div>
    <div class="flow"><i></i><b></b><i></i><b></b><i></i></div>
    <div class="line" style="width: 84%"></div>
    <div class="line" style="width: 60%; margin: 0"></div>
    <img class="stamp" src="../public/sealdown-logo/sealdown-icon-color.svg" alt="">
  </div>
</body>
</html>
